<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu Decoder</title>
<!-- the browser chrome picks up the header gradient's top colour in each mode -->
<meta name="theme-color" content="#FF6B4A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#E23F6B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="app/manifest.webmanifest">
<!-- iOS ignores the manifest's icons for Add to Home Screen and looks for this instead;
     without it the home-screen icon is a blurry screenshot of the page. -->
<link rel="apple-touch-icon" href="app/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Decoder">
<link rel="preload" href="app/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="app/fonts/jakarta-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app/styles.css">
</head>
<body>

<header class="topbar" id="topbar">
  <svg class="topbar-rays" viewBox="0 0 200 200" aria-hidden="true">
    <g stroke="#fff" stroke-width="2" opacity=".7" fill="none">
      <line x1="100" y1="100" x2="100" y2="-10"/><line x1="100" y1="100" x2="170" y2="0"/>
      <line x1="100" y1="100" x2="210" y2="40"/><line x1="100" y1="100" x2="230" y2="100"/>
      <line x1="100" y1="100" x2="210" y2="160"/>
    </g>
  </svg>

  <div class="brandrow">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v6a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3M8 3v6M12 3v18M17 3c-1.5 2-2 4-2 6a2 2 0 0 0 4 0c0-2-.5-4-2-6zM17 12v9"/></svg>
      </span>
      <span class="brand-name">Menu Decoder</span>
    </div>
    <button class="icon-btn" id="btn-profiles" aria-label="Diners">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c.7-3.3 3-5.2 5.5-5.2s4.8 1.9 5.5 5.2"/><circle cx="17" cy="9" r="2.4"/><path d="M15.3 14.3c1.9.2 3.5 1.7 4.2 5"/></svg>
    </button>
  </div>

  <div class="topbar-row">
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.3" y1="15.3" x2="20.5" y2="20.5"/></svg>
      <input id="search" type="search" placeholder="Search any menu word…" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Search">
      <button class="clear-btn" id="btn-clear" aria-label="Clear search" hidden>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
      </button>
    </div>
    <button class="icon-btn" id="btn-filters" aria-label="Filters">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2.2" fill="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="16" cy="12" r="2.2" fill="none"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2.2" fill="none"/></svg>
    </button>
  </div>

  <p class="tagline" id="tagline"></p>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-view="table" role="tab">Table</button>
    <button class="tab" data-view="glossary" role="tab">Glossary</button>
  </nav>
  <div id="active-filters" class="active-filters" hidden></div>
</header>

<main>
  <div id="view-table" class="view">
    <div class="table-scroll">
      <table id="terms-table">
        <thead><tr id="thead-row"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p class="empty" id="table-empty" hidden>Nothing matches. Try a shorter search — spellings vary a lot.</p>
  </div>

  <div id="view-glossary" class="view" hidden>
    <div id="glossary-list"></div>
    <p class="empty" id="glossary-empty" hidden>Nothing matches. Try a shorter search — spellings vary a lot.</p>
  </div>
</main>

<div class="legend" id="legend">
  <span><b>!</b> always</span><span><b>?</b> ask</span><span><b>·</b> rarely</span>
  <span class="legend-sep"></span>
  <span class="chip chip-primary g-nuts demo" aria-hidden="true"><svg width="9" height="9" viewBox="0 0 9 9"><rect width="9" height="9" rx="2" fill="currentColor"/></svg></span> big part
  <span class="chip chip-garnish g-nuts demo" aria-hidden="true"><svg width="9" height="9" viewBox="0 0 9 9"><rect x="1" y="1" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 1.4"/></svg></span> garnish
  <button class="link-btn" id="btn-labels">labels on</button>
</div>

<!-- Detail sheet -->
<div class="sheet-scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
  <button class="sheet-close" id="sheet-close" aria-label="Close">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
  </button>
  <div id="sheet-body"></div>
</section>

<!-- Filters panel -->
<section class="panel" id="panel-filters" hidden>
  <div class="panel-head"><h2>Filters</h2>
    <button class="icon-btn" data-close-panel aria-label="Close">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
    </button>
  </div>
  <div class="panel-body" id="filters-body"></div>
</section>

<!-- Profiles panel -->
<section class="panel" id="panel-profiles" hidden>
  <div class="panel-head"><h2>Diners</h2>
    <button class="icon-btn" data-close-panel aria-label="Close">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
    </button>
  </div>
  <div class="panel-body" id="profiles-body"></div>
</section>

<script src="app/app.js"></script>
</body>
</html>
